<div class="container">
  <h2>Agendar Transferência</h2>
  <form (ngSubmit)="onSubmit()" #transferenciaForm="ngForm">
    <div class="form-group">
      <label for="contaOrigem">Conta de Origem:</label>
      <input
        type="text"
        id="contaOrigem"
        name="contaOrigem"
        [(ngModel)]="transferencia.contaOrigem"
        required
        pattern="[0-9]{10}"
        placeholder="Digite a conta de origem (10 dígitos)"
        class="form-control"
      />
      <small class="form-text text-muted">Formato: XXXXXXXXXX (10 dígitos)</small>
    </div>

    <div class="form-group">
      <label for="contaDestino">Conta de Destino:</label>
      <input
        type="text"
        id="contaDestino"
        name="contaDestino"
        [(ngModel)]="transferencia.contaDestino"
        required
        pattern="[0-9]{10}"
        placeholder="Digite a conta de destino (10 dígitos)"
        class="form-control"
      />
      <small class="form-text text-muted">Formato: XXXXXXXXXX (10 dígitos)</small>
    </div>

    <div class="form-group">
      <label for="valor">Valor da Transferência:</label>
      <input
        type="number"
        id="valor"
        name="valor"
        [(ngModel)]="transferencia.valor"
        required
        min="0.01"
        step="0.01"
        placeholder="Digite o valor"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="dataTransferencia">Data da Transferência:</label>
      <input
        type="date"
        id="dataTransferencia"
        name="dataTransferencia"
        [(ngModel)]="transferencia.dataTransferencia"
        required
        class="form-control"
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!transferenciaForm.form.valid">
      Agendar Transferência
    </button>
  </form>
</div>
