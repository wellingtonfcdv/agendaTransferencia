<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transferências Agendadas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container">
    <h2>Agendar Transferência</h2>
    <form (ngSubmit)="onSubmit()" #transferenciaForm="ngForm">
      <div class="form-group">
        <label for="contaOrigem">Conta de Origem:</label>
        <input type="text" id="contaOrigem" name="contaOrigem" [(ngModel)]="transferencia.contaOrigem" required
          pattern="[0-9]{10}" placeholder="Digite a conta de origem" maxlength="10" class="form-control" />
        
      </div>
  
      <div class="form-group">
        <label for="contaDestino">Conta de Destino:</label>
        <input type="text" id="contaDestino" name="contaDestino" [(ngModel)]="transferencia.contaDestino" required
          pattern="[0-9]{10}" placeholder="Digite a conta de destino" maxlength="10" class="form-control" />
        
      </div>
  
      <div class="form-group">
        <label for="valor">Valor da Transferência:</label>
        <input type="number" id="valor" name="valor" [(ngModel)]="transferencia.valorTransferencia" required min="0.01"
          step="0.01" placeholder="Digite o valor" class="form-control" />
      </div>
  
      <div class="form-group">
        <label for="dataTransferencia">Data da Transferência:</label>
        <input type="date" id="dataTransferencia" name="dataTransferencia" [(ngModel)]="transferencia.dataTransferencia"
          required class="form-control" />
      </div>
  
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="!transferenciaForm.form.valid">
        Agendar Transferência
      </button>
    </form>
  </div>

</body>
